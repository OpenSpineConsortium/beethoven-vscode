<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <style>
      .st{fill:#fff;stroke:#333;stroke-width:1.4;rx:8}
      .you{fill:#fff8e1;stroke:#b8860b;stroke-width:1.4;rx:8}
      .lab{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.6;rx:8}
      .n{font-weight:600;fill:#222}.s{fill:#555;font-size:11.5px}
      .a{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#c)}
      .band{fill:#555;font-size:12px;font-weight:600}
      .legend{fill:#555;font-size:12px}
    </style>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#222">The wizard: strict order, one panel, each step skipped when already done</text>
  <text x="20" y="46" class="legend">gold = you do one thing in the browser or the panel; white = automatic; green = the gate to the lab, last</text>
  <text x="20" y="72" class="band">WHO YOU ARE, THEN YOUR ACCOUNTS (tokens stay on this laptop)</text>
  <g transform="translate(20,82)">
    <rect class="you" x="0" y="0" width="190" height="70"/><text x="10" y="22" class="n">1 Sign in with Wayne State</text><text x="10" y="40" class="s">AccessID@wayne.edu in the browser;</text><text x="10" y="55" class="s">pre-approved AccessIDs only</text>
    <rect class="you" x="210" y="0" width="150" height="70"/><text x="220" y="22" class="n">2 GitHub</text><text x="220" y="40" class="s">sign in; the token</text><text x="220" y="55" class="s">arrives by itself</text>
    <rect class="you" x="380" y="0" width="160" height="70"/><text x="390" y="22" class="n">3 Hugging Face</text><text x="390" y="40" class="s">Create token, Copy;</text><text x="390" y="55" class="s">the panel takes it</text>
    <rect class="you" x="560" y="0" width="190" height="70"/><text x="570" y="22" class="n">4 Claude</text><text x="570" y="40" class="s">claude.ai in the browser,</text><text x="570" y="55" class="s">Authorize; token arrives itself</text>
    <path class="a" d="M190 35 L210 35"/><path class="a" d="M360 35 L380 35"/><path class="a" d="M540 35 L560 35"/>
  </g>
  <text x="20" y="182" class="band">THE GRID (everything above goes there in one pass)</text>
  <g transform="translate(20,192)">
    <rect class="you" x="0" y="0" width="190" height="70"/><text x="10" y="22" class="n">5 Grid account, Authenticator</text><text x="10" y="40" class="s">campus Wi-Fi or VPN, OnDemand</text><text x="10" y="55" class="s">2FA Setup, scan one QR code</text>
    <rect class="st" x="210" y="0" width="110" height="70"/><text x="220" y="22" class="n">6 SSH key</text><text x="220" y="40" class="s">automatic</text>
    <rect class="st" x="340" y="0" width="120" height="70"/><text x="350" y="22" class="n">7 SSH config</text><text x="350" y="40" class="s">automatic</text>
    <rect class="you" x="480" y="0" width="140" height="70"/><text x="490" y="22" class="n">8 Log in once</text><text x="490" y="40" class="s">password + code,</text><text x="490" y="55" class="s">in the panel</text>
    <rect class="st" x="640" y="0" width="200" height="70"/><text x="650" y="22" class="n">9 Install on the grid</text><text x="650" y="40" class="s">scripts and all tokens,</text><text x="650" y="55" class="s">one pass, private files</text>
    <path class="a" d="M190 35 L210 35"/><path class="a" d="M320 35 L340 35"/><path class="a" d="M460 35 L480 35"/><path class="a" d="M620 35 L640 35"/>
  </g>
  <text x="20" y="292" class="band">THE LAB</text>
  <g transform="translate(20,302)">
    <rect class="lab" x="0" y="0" width="840" height="70"/>
    <text x="14" y="24" class="n">10 Join the lab (last)</text>
    <text x="14" y="44" class="s">allowed only when 1 to 9 are green and the tokens work; one request to your lead; approval lets you read the lab folder</text>
    <text x="14" y="60" class="s">(datasets, Claude containers, software). You never write there: your science lives in your own grid account.</text>
  </g>
  <path class="a" d="M860 117 C 935 117, 935 227, 860 227"/>
  <path class="a" d="M860 227 C 935 227, 935 337, 860 337"/>
</svg>
