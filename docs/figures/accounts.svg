<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .b{fill:#fff;stroke:#333;stroke-width:1.4;rx:8}
      .w{fill:#fdecea;stroke:#b71c1c;stroke-width:1.4;rx:8}
      .g{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.4;rx:8}
      .n{font-weight:600;fill:#222}.s{fill:#555;font-size:11.5px}
      .a{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#d)}
    </style>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#222">When the subscription window is spent: wait for the reset</text>
  <rect class="b" x="20" y="60" width="200" height="64"/><text x="30" y="82" class="n">request arrives</text><text x="30" y="100" class="s">Claude Code signed in?</text><text x="30" y="114" class="s">sign-in not on cooldown?</text>
  <rect class="g" x="260" y="60" width="200" height="64"/><text x="270" y="82" class="n">~/.beethoven/claude</text><text x="270" y="100" class="s">Claude Code's own sign-in</text><text x="270" y="114" class="s">your subscription only</text>
  <rect class="w" x="260" y="170" width="200" height="64"/><text x="270" y="192" class="n">result says limit hit</text><text x="270" y="210" class="s">"hit your limit", 429, rate_limit</text><text x="270" y="224" class="s">cooldown_until = reset time or +60 min</text>
  <rect class="b" x="520" y="60" width="200" height="64"/><text x="530" y="82" class="n">answer written</text><text x="530" y="100" class="s">status ok</text>
  <rect class="w" x="520" y="170" width="440" height="64"/><text x="530" y="192" class="n">window spent</text><text x="530" y="210" class="s">status rate_limited, retry_after = reset time; worker heartbeat = blocked</text><text x="530" y="224" class="s">the laptop shows the reset time; send the request again after it</text>
  <path class="a" d="M220 92 L260 92"/>
  <path class="a" d="M360 124 L360 170"/>
  <path class="a" d="M460 92 L520 92"/>
  <path class="a" d="M460 202 L520 202"/>
  <text x="20" y="275" class="s">Beethoven uses no API key and asks for no paid usage, and never another student's account: the Consumer Terms bind an account to its holder.</text>
</svg>
