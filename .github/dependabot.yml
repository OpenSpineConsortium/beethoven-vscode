version: 2
updates:
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Kept equal to engines.vscode in extension/package.json: vsce refuses to package when the
      # types are newer, and newer types would let the code call an API the oldest supported VS Code
      # lacks. Raise the two together, by hand.
      - dependency-name: "@types/vscode"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
