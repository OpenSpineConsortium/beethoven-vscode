# One Worker, two names. This file names beethoven-access, the primary name (Beethoven 7.0.0 on, Beethoven
# for VS Code 4.0.0 on). The same code stays deployed as ashley-service, with
# `WORKER_NAME=ashley-service bash deploy.sh`, because Ashley for VS Code 3.0.0 and Beethoven 4.0.0 to 6.0.0
# were built with that address and know no other; deploy.sh passes --name, uses these same vars and KV
# namespace ids, and gives both names the same secrets.
name = "beethoven-access"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_DOMAINS = "wayne.edu"
TRIAL_DAYS = "365"
# the website the request and admin pages are served from: the only origin /request and /admin/* accept
SITE_ORIGIN = "https://openspineconsortium.com"
# where /trial, and an access check from any product but the browser edition, send a person who is not
# approved yet (/ashley/request.html, which older builds open, redirects to the same page)
REQUEST_PAGE = "https://openspineconsortium.com/beethoven/request.html"
# where an access check from the browser edition (product "bridge" or "beethoven") sends that person
BEETHOVEN_REQUEST_PAGE = "https://openspineconsortium.com/beethoven/request.html"
# the maintainer's page the request e-mails and the /decide pages link to
ADMIN_PAGE = "https://openspineconsortium.com/beethoven/admin.html"
# the prefixes /trial signs keys and /revoked signs its list with: "ashley" (ASHLEY1, ASHLEYREV1), or
# "beethoven" (BEETHOVEN1, BEETHOVENREV1). Flip only after every installed build older than Beethoven 8.0.0
# and Beethoven for VS Code 4.0.0 is retired: those builds, and the grid scripts before 7, accept the old
# prefixes only. Deploy both names after a change.
KEY_PREFIX = "ashley"
# "0": an access check without install_id (every Beethoven before 8.0.0) is still answered from the approved
# list alone, so the builds in use keep working. Set it to "1" once Beethoven 8.0.0 is on the private
# listing and installed; from then on such a check is refused with reason update_required. A check that
# carries install_id is held to one installation per account either way. Deploy both names after a change.
REQUIRE_INSTALL_ID = "0"
# "1": mailbox confirmation is required. A request is first e-mailed to the student at <AccessID>@wayne.edu
# with a "Confirm it is you" link and reaches the maintainer only when they use it; one not confirmed is
# dropped after 7 days; the student is e-mailed when approved for Beethoven. Only after
# openspineconsortium.com is verified at Resend and mail_from names it (README.md, "The request portal"):
# until then Resend refuses every address but the account owner's, and with "1" every request would be
# answered "could not be sent" and wait unconfirmed. "0" (until 2026-10-01): the maintainer is e-mailed at once, the
# e-mail says "Mailbox: not verified", and nobody else is e-mailed.
# "1" since 2026-10-01: Resend verified openspineconsortium.com (a test from access@openspineconsortium.com
# was accepted with HTTP 200) and mail_from in the vendor folder names that address.
MAIL_STUDENTS = "1"
# the Google Group of the private listing, Beethoven-users: "manual" (today; a consumer group has no API
# for its members, so the Approve page shows the address to invite and a Done, invited button), or
# "workspace" when the lab has a Google Workspace: the service then adds the account itself with the
# Directory API on GROUP_ADDRESS (secrets GROUP_SA_KEY and GROUP_ADMIN_SUBJECT; README.md, "The private
# listing"). Deploy both names after a change.
GROUP_MODE = "manual"
GROUP_ADDRESS = "beethoven-users@openspineconsortium.com"
# "how it works", in the student's e-mail after approval (MAIL_STUDENTS "1")
ONBOARDING_PAGE = "https://openspineconsortium.com/beethoven/"
# The daily reminder of approvals not yet invited: both names run the cron below, only this one sends it
# (deploy.sh gives each name SERVICE_NAME, its own name), and its Done, invited links point here.
REMINDER_FROM = "beethoven-access"
SERVICE_ORIGIN = "https://beethoven-access.openspineconsortium.workers.dev"

# once a day, 13:00 UTC (9:00 in Detroit in summer, 8:00 in winter): the invitation reminder
[triggers]
crons = ["0 13 * * *"]

# secrets, never here: TRIAL_KEY_PKCS8_B64, TRIAL_KID, ADMIN_TOKEN, IP_SALT, GITHUB_TOKEN, GITHUB_REPO,
# DECIDE_KEY, NOTIFY_TO, MAIL_FROM, RESEND_API_KEY (the e-mail about each request; no binding needed),
# and only with GROUP_MODE "workspace": GROUP_SA_KEY, GROUP_ADMIN_SUBJECT
# (wrangler secret put, see README.md)

# paste the ids that `wrangler kv namespace create` prints; both Worker names bind these same three
[[kv_namespaces]]
binding = "TRIALS"
id = "328006d0894d4b45be7fb5e7becaec62"

[[kv_namespaces]]
binding = "REPORTS"
id = "1af1580f28a248e7b51b084df7d40955"

# approved, pending and denied people, the revocation list and the audit lines
[[kv_namespaces]]
binding = "ACCESS"
id = "d0604151a4c3417a8c372becb4e6a984"
